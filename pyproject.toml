[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-model-sync"
version = "0.2.0"
description = "One source of truth for LLM model limits (context window and max output), rendered into each coding-harness config."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "tomli-w>=1.0"]

[project.scripts]
harness-model-sync = "harness_model_sync.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
